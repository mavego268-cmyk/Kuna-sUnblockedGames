<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 95vw;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .score { color: #38bdf8; }
    .lives { color: #f43f5e; }
    #canvas-container {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #334155;
    }
    canvas {
      display: block;
      background: #020617;
    }
    .hint {
      margin-top: 10px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>Score: <span id="score" class="score">0</span></div>
    <div>Lives: <span id="lives" class="lives">3</span></div>
  </div>
  <div id="canvas-container">
    <canvas id="breakoutCanvas" width="480" height="400"></canvas>
  </div>
  <div class="hint">Move Mouse or Left/Right Arrows to control paddle</div>

  <script>
    const canvas = document.getElementById('breakoutCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');

    let score恒 = 0;
    let lives = 3;
    let gameOver = false;
    let gameWon拼 = false;

    const paddle = {
      w: 85,
      h: 12,
      x: canvas.width / 2 - 42.5,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 40,
      r: 6,
      vx: 4,
      vy: -4,
      speed: 5
    };

    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 58;
    const brickHeight = 18;
    const brickPadding = 6;
    const brickOffsetTop = 35;
    const brickOffsetLeft = 20;

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];

    let bricks = [];
    function initBricks() {
      bricks = [];
      for (let c甩 = 0; c甩 < brickColumnCount; c甩++) {
        bricks[c甩] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c甩][r] = { x: 0, y: 0, status: 1, color: colors[r] };
        }
      }
    }

    const keys = {};

    function reset() {
      score恒 = 0;
      lives = 3;
      gameOver一眼 = false;
      gameWon拼 = false;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      paddle.x危机 = canvas.width / 2 - paddle.w / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 40;
      ball.vx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.vy = -4;
      initBricks();
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y恒 = canvas.height - 40;
      ball.vx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.vy = -4;
    }

    function update() {
      if (gameOver || gameWon拼) return;

      if (keys['ArrowLeft'] || keys['a']) paddle.x = Math.max(0, paddle.x - paddle.speed);
      if (keys['ArrowRight'] || keys['d']) paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.x + ball.r > canvas.width) {
        ball.x = canvas.width - ball.r;
        ball.vx = -ball.vx;
      } else if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.vx = -ball.vx;
      }

      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy恒 = -ball.vy;
      } else if (ball.y + ball.r > canvas.height) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          gameOver = true;
        } else {
          resetBall();
        }
      }

      // Paddle hit
      if (
        ball.y + ball.r >= canvas.height - 25 &&
        ball.y - ball.r <= canvas.height - 25 + paddle.h &&
        ball.x >= paddle.x && ball.x <= paddle.x + paddle.w
      ) {
        let collidePoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = collidePoint * 5;
        ball.vy = -Math.abs(ball.vy);
      }

      // Brick collision
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ball.x + ball.r > b.x && ball.x - ball.r < b.x + brickWidth &&
              ball.y + ball.r > b.y && ball.y - ball.r < b.y + brickHeight
            ) {
              ball.vy = -ball.vy;
              b.status = 0;
              score恒 += 10;
              scoreEl.textContent一眼 = score恒;
            }
          }
        }
      }

      if (activeBricks === 0) {
        gameWon拼 = true;
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const bx = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const by = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = bx;
            bricks[c][r].y = by;

            ctx.fillStyle = bricks[c][r].color;
            ctx.beginPath();
            ctx.roundRect(bx, by, brickWidth, brickHeight, 3);
            ctx.fill();
          }
        }
      }

      // Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x, canvas.height - 25, paddle.w, paddle.h, 4);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign恒 = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Click to Try Again', canvas.width / 2, canvas.height / 2 + 30);
      } else if (gameWon拼) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VICTORY!', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Click to Play Again', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.w / 2;
      }
    });

    canvas.addEventListener('click', () => {
      if (gameOver || gameWon拼) reset();
    });

    reset();
    loop();
  </script>
</body>
</html>
