<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 360px;
      max-width: 95vw;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .moves { color: #38bdf8; }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 75px);
      grid-gap: 10px;
    }
    .card {
      width: 75px;
      height: 75px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card:hover { transform: scale(1.04); }
    .card.flipped {
      background: #0f172a;
      border-color: #38bdf8;
      transform: rotateY(180deg);
    }
    .card.matched {
      background: #064e3b;
      border-color: #10b981;
      cursor: default;
      transform: scale(0.96);
    }
    .hint {
      margin-top: 14px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>Moves: <span id="moves" class="moves">0</span></div>
    <div id="match-status">Pairs: 0/8</div>
    <button class="btn" onclick="init()">Restart</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Flip cards to match all 8 pairs!</div>

  <script>
    const emojis = ['🚀', '👾', '🕹️', '💎', '🔥', '⚡', '⭐', '🍕'];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;

    const gridEl = document.getElementById('grid');
    const movesEl = document.getElementById('moves');
    const statusEl = document.getElementById('match-status');

    function init() {
      cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      lockBoard = false;
      movesEl.textContent = '0';
      statusEl.textContent = 'Pairs: 0/8';
      gridEl.innerHTML = '';

      cards.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.dataset.index = index;
        card.textContent = '❓';
        card.addEventListener('click', () => flipCard(card));
        gridEl.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      card.textContent = card.dataset.emoji;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.emoji === c2.dataset.emoji) {
        c1.classList.add('matched');
        c2.classList.add('matched');
        matchedPairs++;
        statusEl.textContent = `Pairs: ${matchedPairs}/8`;
        flippedCards = [];
        if (matchedPairs === 8) {
          statusEl.textContent = '🎉 You Won in ' + moves + ' moves!';
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          c1.textContent = '❓';
          c2.textContent = '❓';
          flippedCards = [];
          lockBoard = false;
        }, 900);
      }
    }

    init();
  </script>
</body>
</html>
