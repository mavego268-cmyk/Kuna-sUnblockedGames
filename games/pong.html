<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 500px;
      max-width: 95vw;
      margin-bottom: 12px;
    }
    .score-display {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .p1-score { color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    .p2-score { color: #f43f5e; text-shadow: 0 0 10px rgba(244,63,94,0.5); }
    .mode-select {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #canvas-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      border: 2px solid #1e293b;
    }
    canvas {
      display: block;
      background: #030712;
    }
    .controls-hint {
      margin-top: 14px;
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="score-display">
      <span class="p1-score" id="p1-score">0</span>
      <span style="color: #475569; margin: 0 8px;">:</span>
      <span class="p2-score" id="p2-score">0</span>
    </div>
    <select class="mode-select" id="mode-select" onchange="changeMode(this.value)">
      <option value="ai-easy">vs CPU (Easy)</option>
      <option value="ai-hard" selected>vs CPU (Hard)</option>
      <option value="2p">2 Players Local (W/S & Up/Down)</option>
    </select>
  </div>

  <div id="canvas-wrap">
    <canvas id="pongCanvas" width="540" height="360"></canvas>
  </div>

  <div class="controls-hint" id="hint">Player 1: W / S or Mouse | Player 2 (CPU): Auto</div>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const hintEl = document.getElementById('hint');

    let mode = 'ai-hard';
    let p1Score = 0;
    let p2Score = 0;

    const PADDLE_WIDTH = 10;
    const PADDLE_HEIGHT = 70;
    const BALL_RADIUS = 6;

    let p1 = { x: 15, y: canvas.height / 2 - PADDLE_HEIGHT / 2, vy: 0, speed: 7 };
    let p2 = { x: canvas.width - 25, y: canvas.height / 2 - PADDLE_HEIGHT / 2, vy: 0, speed: 5.5 };
    let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5, vy: 3, speed: 6 };

    const keys = {};

    function resetBall(servingPlayer = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8);
      const dir = servingPlayer === 1 ? 1 : -1;
      ball.speed = 6;
      ball.vx = dir * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function changeMode(newMode) {
      mode = newMode;
      if (mode === '2p') {
        hintEl.textContent = 'Player 1: W / S | Player 2: Arrow Up / Arrow Down';
      } else {
        hintEl.textContent = 'Player 1: W / S or Mouse | Player 2 (CPU): Auto';
      }
      p1Score = 0;
      p2Score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      resetBall();
    }

    function update() {
      // P1 movement
      if (keys['w'] || keys['W']) p1.y -= p1.speed;
      if (keys['s'] || keys['S']) p1.y += p1.speed;

      // P2 movement
      if (mode === '2p') {
        if (keys['ArrowUp']) p2.y -= p2.speed;
        if (keys['ArrowDown']) p2.y += p2.speed;
      } else {
        // AI movement
        const targetY = ball.y - PADDLE_HEIGHT / 2;
        const aiSpeed = mode === 'ai-easy' ? 3.5 : 5.8;
        if (p2.y < targetY - 10) p2.y += aiSpeed;
        else if (p2.y > targetY + 10) p2.y -= aiSpeed;
      }

      // Constrain paddles
      p1.y = Math.max(5, Math.min(canvas.height - PADDLE_HEIGHT - 5, p1.y));
      p2.y = Math.max(5, Math.min(canvas.height - PADDLE_HEIGHT - 5, p2.y));

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce (top/bottom)
      if (ball.y - BALL_RADIUS <= 0) {
        ball.y = BALL_RADIUS;
        ball.vy = -ball.vy;
      } else if (ball.y + BALL_RADIUS >= canvas.height) {
        ball.y = canvas.height - BALL_RADIUS;
        ball.vy = -ball.vy;
      }

      // P1 paddle hit
      if (ball.x - BALL_RADIUS <= p1.x + PADDLE_WIDTH &&
          ball.x + BALL_RADIUS >= p1.x &&
          ball.y >= p1.y && ball.y <= p1.y + PADDLE_HEIGHT) {
        let collidePoint = (ball.y - (p1.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        let angle = collidePoint * (Math.PI / 3);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = ball.speed * Math.cos(angle);
        ball.vy = ball.speed * Math.sin(angle);
        ball.x = p1.x + PADDLE_WIDTH + BALL_RADIUS;
      }

      // P2 paddle hit
      if (ball.x + BALL_RADIUS >= p2.x &&
          ball.x - BALL_RADIUS <= p2.x + PADDLE_WIDTH &&
          ball.y >= p2.y && ball.y <= p2.y + PADDLE_HEIGHT) {
        let collidePoint = (ball.y - (p2.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        let angle = collidePoint * (Math.PI / 3);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = -ball.speed * Math.cos(angle);
        ball.vy = ball.speed * Math.sin(angle);
        ball.x = p2.x - BALL_RADIUS;
      }

      // Scoring
      if (ball.x < 0) {
        p2Score++;
        p2ScoreEl.textContent = p2Score;
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1Score++;
        p1ScoreEl.textContent = p1Score;
        resetBall(-1);
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle (Cyan glow)
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(p1.x, p1.y, PADDLE_WIDTH, PADDLE_HEIGHT, 4);
      ctx.fill();

      // P2 Paddle (Rose glow)
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(p2.x, p2.y, PADDLE_WIDTH, PADDLE_HEIGHT, 4);
      ctx.fill();

      // Ball (White neon)
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (mode !== '2p') {
        const rect = canvas.getBoundingClientRect();
        p1.y = e.clientY - rect.top - PADDLE_HEIGHT / 2;
      }
    });

    resetBall();
    loop();
  </script>
</body>
</html>
