<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .game-box {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .counter {
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 800;
      color: #ef4444;
      background: #020617;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .face-btn {
      font-size: 1.4rem;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
    .face-btn:hover { transform: scale(1.1); }
    .grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 2px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 2px;
    }
    .cell:hover:not(.revealed) { background: #64748b; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #ef4444 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #c084fc; }
    .c-5 { color: #f59e0b; }
    .c-6 { color: #2dd4bf; }
    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <div class="counter" id="mine-count">010</div>
      <button class="face-btn" id="face-btn" onclick="init()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="hint">Left Click: Reveal | Right Click / Long Press: Flag 🚩</div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let gameOver = false;
    let timerInterval = null;
    let seconds = 0;
    let firstClick = true;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');

    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

    function init() {
      board = [];
      revealedCount = 0;
      flagsCount = 0;
      gameOver = false;
      firstClick = true;
      seconds = 0;
      clearInterval(timerInterval);
      timerInterval = null;
      timerEl.textContent = '000';
      faceBtn.textContent = '🙂';
      mineCountEl.textContent = String(MINES).padStart(3, '0');

      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          };
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.id = `cell-${r}-${c}`;
          cellEl.addEventListener('click', () => handleClick(r, c));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });
          gridEl.appendChild(cellEl);
        }
      }
    }

    function plantMines(safeR, safeC) {
      let placed = 0;
      while (placed < MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine && !(r === safeR && c === safeC)) {
          board[r][c].mine = true;
          placed++;
        }
      }

      // Calculate neighbor mine counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function handleClick(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        timerInterval = setInterval(() => {
          seconds++;
          timerEl.textContent = String(Math.min(999, seconds)).padStart(3, '0');
        }, 1000);
      }

      if (cell.mine) {
        // Explode
        gameOver = true;
        clearInterval(timerInterval);
        faceBtn.textContent = '😵';
        revealAllMines();
        return;
      }

      revealCell(r, c);

      // Check win
      if (revealedCount === ROWS * COLS - MINES) {
        gameOver = true;
        clearInterval(timerInterval);
        faceBtn.textContent = '😎';
      }
    }

    function revealCell(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      revealedCount++;
      const el = document.getElementById(`cell-${r}-${c}`);
      el.classList.add('revealed');

      if (cell.count > 0) {
        el.textContent = cell.count;
        el.classList.add(`c-${cell.count}`);
      } else {
        // Zero count, auto reveal neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      const el = document.getElementById(`cell-${r}-${c}`);
      if (cell.flagged) {
        el.textContent = '🚩';
        flagsCount++;
      } else {
        el.textContent = '';
        flagsCount--;
      }
      mineCountEl.textContent = String(Math.max(0, MINES - flagsCount)).padStart(3, '0');
    }

    function revealAllMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const el = document.getElementById(`cell-${r}-${c}`);
          if (cell.mine) {
            el.classList.add('revealed', 'mine');
            el.textContent = '💣';
          }
        }
      }
    }

    init();
  </script>
</body>
</html>
