<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird HTML5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 3px solid #334155;
    }
    canvas {
      display: block;
      background: #70c5ce;
    }
    .score-overlay {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      pointer-events: none;
    }
    .hint {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="flappyCanvas" width="340" height="480"></canvas>
    <div class="score-overlay" id="score-display">0</div>
  </div>
  <div class="hint">Press Space, Click, or Tap to Flap</div>

  <script>
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');

    let state = 'start'; // 'start', 'play', 'gameover'
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let frames = 0;

    const bird = {
      x: 60,
      y: 200,
      w: 26,
      h: 20,
      gravity: 0.32,
      velocity: 0,
      jump: -5.8,
      rotation: 0
    };

    let pipes = [];
    const PIPE_WIDTH = 52;
    const PIPE_GAP = 120;
    const PIPE_SPEED = 2.2;

    function reset() {
      bird.y = 200;
      bird.velocity = 0;
      bird.rotation = 0;
      pipes = [];
      score = 0;
      scoreDisplay.textContent = '0';
      frames = 0;
      state = 'play';
    }

    function flap() {
      if (state === 'start' || state === 'gameover') {
        reset();
      } else if (state === 'play') {
        bird.velocity = bird.jump;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    function update() {
      frames++;

      if (state === 'play') {
        // Bird physics
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity * 4) * Math.PI / 180));

        // Ground / ceiling
        if (bird.y + bird.h >= canvas.height - 50) {
          bird.y = canvas.height - 50 - bird.h;
          state = 'gameover';
        }
        if (bird.y <= 0) {
          bird.y = 0;
          bird.velocity = 0;
        }

        // Spawn pipes
        if (frames % 100 === 0) {
          const topHeight = Math.floor(Math.random() * (canvas.height - 50 - PIPE_GAP - 80)) + 40;
          pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: canvas.height - 50 - (topHeight + PIPE_GAP),
            passed: false
          });
        }

        // Move pipes
        for (let i = 0; i < pipes.length; i++) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          // Collision detection
          if (
            bird.x + bird.w > p.x && bird.x < p.x + PIPE_WIDTH &&
            (bird.y < p.top || bird.y + bird.h > canvas.height - 50 - p.bottom)
          ) {
            state = 'gameover';
          }

          // Scoring
          if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
            p.passed = true;
            score++;
            scoreDisplay.textContent = score;
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('flappy_best', highScore);
            }
          }
        }

        // Remove off-screen pipes
        pipes = pipes.filter(p => p.x + PIPE_WIDTH > 0);
      }
    }

    function draw() {
      // Sky
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(80, 80, 25, 0, Math.PI * 2);
      ctx.arc(105, 75, 30, 0, Math.PI * 2);
      ctx.arc(130, 80, 25, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(240, 130, 20, 0, Math.PI * 2);
      ctx.arc(260, 125, 25, 0, Math.PI * 2);
      ctx.arc(280, 130, 20, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      for (const p of pipes) {
        // Top Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 2, p.top - 20, PIPE_WIDTH + 4, 20);

        // Pipe highlights
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(p.x + 4, 0, 6, p.top);
        ctx.fillRect(p.x + 2, p.top - 20, 6, 20);

        // Bottom Pipe
        const bottomY = canvas.height - 50 - p.bottom;
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, bottomY, PIPE_WIDTH, p.bottom);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 2, bottomY, PIPE_WIDTH + 4, 20);

        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(p.x + 4, bottomY, 6, p.bottom);
        ctx.fillRect(p.x + 2, bottomY, 6, 20);
      }

      // Ground
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 10);

      // Draw Bird
      ctx.save();
      ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
      ctx.rotate(bird.rotation);

      // Body (Yellow)
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(8, -1);
      ctx.lineTo(16, 2);
      ctx.lineTo(8, 5);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 6, 4, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Overlays
      if (state === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FLAPPY BIRD', canvas.width / 2, 180);
        ctx.font = '15px sans-serif';
        ctx.fillText('Press SPACE or Tap to Play', canvas.width / 2, 220);
        ctx.font = '13px sans-serif';
        ctx.fillText(`Best Score: ${highScore}`, canvas.width / 2, 260);
      } else if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 170);
        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 210);
        ctx.fillText(`Best: ${highScore}`, canvas.width / 2, 240);
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('Tap or Space to Retry', canvas.width / 2, 280);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
