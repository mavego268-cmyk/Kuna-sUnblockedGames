<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 400px;
      max-width: 95vw;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .score-badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .score-val { color: #10b981; font-weight: 700; }
    .high-val { color: #f59e0b; font-weight: 700; }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }
    canvas {
      display: block;
      background: #020617;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    h1 { font-size: 1.8rem; color: #38bdf8; letter-spacing: 1px; }
    p { color: #94a3b8; font-size: 0.95rem; }
    button {
      background: #10b981;
      color: #020617;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #34d399; transform: translateY(-1px); }
    .controls-hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="score-badge">Score: <span id="score" class="score-val">0</span></div>
    <div class="score-badge">High Score: <span id="high-score" class="high-val">0</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">RETRO SNAKE</h1>
      <p id="overlay-msg">Use Arrow Keys or WASD to Slither</p>
      <button id="start-btn" onclick="startGame()">PLAY NOW</button>
    </div>
  </div>

  <div class="controls-hint">Controls: Arrow Keys / WASD | Space to Pause</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    highScoreEl.textContent = highScore;

    let gameInterval = null;
    let isRunning = false;
    let isPaused = false;
    let speed = 110;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      dx = 0;
      dy = -1;
      nextDx = 0;
      nextDy = -1;
      score = 0;
      scoreEl.textContent = score;
      placeFood();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function startGame() {
      initGame();
      overlay.style.display = 'none';
      isRunning = true;
      isPaused = false;
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, speed);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_highscore', highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = "GAME OVER";
      overlayMsg.textContent = `You scored ${score} points!`;
      startBtn.textContent = "TRY AGAIN";
      overlay.style.display = 'flex';
    }

    function gameLoop() {
      if (isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
        // subtle speed increase
        if (score % 50 === 0 && speed > 60) {
          speed -= 5;
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background dots
      ctx.fillStyle = '#1e293b';
      for (let x = 0; x < canvas.width; x += GRID_SIZE) {
        for (let y = 0; y < canvas.height; y += GRID_SIZE) {
          ctx.fillRect(x + GRID_SIZE - 2, y + GRID_SIZE - 2, 2, 2);
        }
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 3, food.y * GRID_SIZE + GRID_SIZE / 3, 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake body
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981';
        } else {
          const ratio = index / snake.length;
          ctx.fillStyle = ratio > 0.6 ? '#059669' : '#34d399';
        }
        ctx.beginPath();
        ctx.roundRect(
          segment.x * GRID_SIZE + 1,
          segment.y * GRID_SIZE + 1,
          GRID_SIZE - 2,
          GRID_SIZE - 2,
          index === 0 ? 5 : 3
        );
        ctx.fill();

        // Snake eyes
        if (index === 0) {
          ctx.fillStyle = '#020617';
          let eye1X, eye1Y, eye2X, eye2Y;
          if (dx === 1) {
            eye1X = segment.x * GRID_SIZE + 14; eye1Y = segment.y * GRID_SIZE + 5;
            eye2X = segment.x * GRID_SIZE + 14; eye2Y = segment.y * GRID_SIZE + 15;
          } else if (dx === -1) {
            eye1X = segment.x * GRID_SIZE + 6; eye1Y = segment.y * GRID_SIZE + 5;
            eye2X = segment.x * GRID_SIZE + 6; eye2Y = segment.y * GRID_SIZE + 15;
          } else if (dy === 1) {
            eye1X = segment.x * GRID_SIZE + 5; eye1Y = segment.y * GRID_SIZE + 14;
            eye2X = segment.x * GRID_SIZE + 15; eye2Y = segment.y * GRID_SIZE + 14;
          } else {
            eye1X = segment.x * GRID_SIZE + 5; eye1Y = segment.y * GRID_SIZE + 6;
            eye2X = segment.x * GRID_SIZE + 15; eye2Y = segment.y * GRID_SIZE + 6;
          }
          ctx.beginPath();
          ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
          ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === ' ' && isRunning) {
        isPaused = !isPaused;
        return;
      }

      if (!isRunning) return;

      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dy === 0) { nextDx = 0; nextDy = -1; }
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dy === 0) { nextDx = 0; nextDy = 1; }
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dx === 0) { nextDx = -1; nextDy = 0; }
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dx === 0) { nextDx = 1; nextDy = 0; }
          break;
      }
    });

    draw();
  </script>
</body>
</html>
